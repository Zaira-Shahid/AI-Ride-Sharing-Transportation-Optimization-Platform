[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

# Phase 13 (AI/ML, module app/ml/): scikit-learn ships no official type stubs package (unlike
# pandas, whose stubs are installed via requirements-dev.txt's own pandas-stubs) - ignore its
# missing types rather than leaving every one of its call sites unchecked project-wide.
[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true
